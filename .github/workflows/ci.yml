name: CI

# Se ejecuta en CUALQUIER push a cualquier rama (no solo main) y en las PR
# hacia main. Antes solo cubría main, así que una rama de trabajo como
# `neon-termostato-card` solo pasaba por `validate.yml` (HACS) y nadie
# comprobaba ESLint, TypeScript, tests, build ni rendimiento hasta
# llegar a main. Los tags `v*` los gestiona release.yml.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pushes seguidos a la misma rama cancelan la ejecución anterior, que ya
# no sirve: solo importa el último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: npm run perf
