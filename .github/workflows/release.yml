name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Mismas comprobaciones que ci.yml: si fallan, no se publica la release
      # (acuerdo nº21). El build ya incluye la comprobación de tipos (tsc -b).
      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-Beta.') }}
          files: dist-cards/*.js
          fail_on_unmatched_files: false
