name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Empaquetar los dist/ de cada tarjeta
        run: |
          mkdir -p release-assets
          for dir in cards/*/; do
            name=$(basename "$dir")
            if [ -d "${dir}dist" ]; then
              (cd "$dir" && zip -r "../../release-assets/${name}.zip" dist)
            fi
          done

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          files: release-assets/*.zip
          fail_on_unmatched_files: false
