name: Validate

# Solo manual por ahora (Actions -> Validate -> Run workflow). Reactivar
# push/pull_request/schedule cuando haya un primer release ESTABLE (no
# beta): sin un "latest release" real, hacs/action valida directamente la
# rama main, que nunca tiene el .js compilado (solo se genera en release),
# así que fallaría en cada push mientras solo existan prereleases.
on:
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "plugin"
